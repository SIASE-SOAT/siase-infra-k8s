apiVersion: v1
kind: Service
metadata:
  name: siase-os-metrics
  namespace: siase
  labels:
    siase-metrics: "true"
spec:
  type: ClusterIP
  selector:
    app: siase-os-service
  ports:
    - name: metrics
      port: 8081
      targetPort: 8081
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: siase-os-service
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - siase
  selector:
    matchLabels:
      siase-metrics: "true"
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 30s
---
