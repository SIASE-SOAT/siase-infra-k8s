name: deploy-prod

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
      - run: terraform apply -auto-approve -var="aws_region=${{ vars.AWS_REGION }}" -var="environment=production" -var="grafana_secret_arn=${{ vars.GRAFANA_SECRET_ARN }}"
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"
      - run: kubectl apply -f k8s/alertmanager-config.yaml -f k8s/prometheus-rule.yaml
      - name: Publish application ALB DNS to SSM
        run: |
          for attempt in $(seq 1 30); do
            alb_dns="$(kubectl get ingress -n siase siase-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -n "$alb_dns" ]; then
              aws ssm put-parameter \
                --name "/siase/production/alb-dns" \
                --type String \
                --value "$alb_dns" \
                --overwrite
              exit 0
            fi
            sleep 20
          done
          echo "ALB DNS ainda não foi publicado pelo AWS Load Balancer Controller" >&2
          exit 1
