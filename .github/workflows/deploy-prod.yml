name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml
  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Credenciais temporárias do Learner Lab: expiram ao fim da sessão de 4h
      # e precisam ser atualizadas nos secrets do GitHub a cada nova sessão.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init and apply
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_lab_role_arn: ${{ vars.LAB_ROLE_ARN }}
          TF_VAR_vpc_id: ${{ vars.VPC_ID }}
          TF_VAR_lambda_security_group_id: ${{ vars.LAMBDA_SECURITY_GROUP_ID }}
          TF_VAR_jwt_secret_name: ${{ vars.JWT_SECRET_NAME }}
          TF_VAR_lb_dns_override: ${{ vars.LB_DNS_OVERRIDE }}
        run: |
          export TF_VAR_private_subnet_ids="$(printf '%s' '${{ vars.PRIVATE_SUBNET_IDS }}' | jq -R 'split(\",\")')"
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform apply -auto-approve
